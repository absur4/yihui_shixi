<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>通信中间件统一测试结果</title>
<style>
:root{font-family:Segoe UI,Microsoft YaHei,sans-serif;color:#e5edf5;background:#0b1320;color-scheme:dark}*{box-sizing:border-box}body{margin:0}main{max-width:1440px;margin:auto;padding:28px}h1{margin:0 0 8px}.panel{background:#131f2e;border:1px solid #2b3b50;border-radius:14px;padding:18px;margin:16px 0}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}button,.button,select{border:1px solid #3a526c;border-radius:8px;padding:9px 12px;background:#182a3e;color:#e5edf5}.button{background:#55d6ae;color:#07271e;font-weight:700;cursor:pointer}input{display:none}.warning{border-left:3px solid #f2c66d;background:#342b1c;padding:10px;white-space:pre-wrap}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:900px;font-size:13px}th,td{padding:10px;border-bottom:1px solid #293a50;text-align:left;vertical-align:top}th{color:#9fb5ca}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#0e1928;padding:14px;border-radius:10px}.value{font-size:21px;color:#65ddb8}.muted{color:#93a7bb}.error{color:#ffaaaa;white-space:pre-wrap}pre{white-space:pre-wrap}@media(max-width:900px){.cards{grid-template-columns:1fr 1fr}main{padding:14px}}</style></head>
<body><main><h1>通信中间件统一测试结果</h1><p class="muted">本地离线读取统一结果；只有筛选维度完全一致的运行才可横向比较。</p>
<section class="panel"><div class="controls"><label class="button" for="files">导入 JSON</label><input id="files" type="file" accept=".json" multiple><button id="clear">清空</button>
<select id="scenario_id"><option value="">全部场景 ID</option></select><select id="payload_size_bytes"><option value="">全部消息大小</option></select>
<select id="publish_rate_hz"><option value="">全部频率</option></select><select id="topology"><option value="">全部拓扑</option></select>
<select id="transport_mode"><option value="">全部传输</option></select><select id="qos_profile"><option value="">全部 QoS</option></select>
<select id="network_profile"><option value="">全部网络条件</option></select></div><div id="errors" class="error"></div></section>
<div id="warning"></div><section class="panel"><div id="cards" class="cards"></div></section>
<section class="panel"><h2>逐轮结果</h2><div id="runs" class="scroll"></div></section>
<section class="panel"><h2>发布者、订阅者与链路</h2><div id="links" class="scroll"></div></section>
<section class="panel"><h2>资源与弱网注入</h2><div id="resources" class="scroll"></div></section>
<section class="panel"><h2>功能 / 特性画像</h2><div id="features" class="scroll"></div></section></main>
<script>
"use strict";
const datasets=new Map(),profiles=new Map();
const filterIds=["scenario_id","payload_size_bytes","publish_rate_hz","topology","transport_mode","qos_profile","network_profile"];
const fmt=v=>typeof v==="number"&&Number.isFinite(v)?v.toLocaleString("zh-CN",{maximumFractionDigits:5}):(v??"—");
const topology=r=>r.publisher_count+"P/"+r.subscriber_count+"S";
function table(headers,rows){const t=document.createElement("table"),h=t.insertRow();headers.forEach(x=>{const c=document.createElement("th");c.textContent=x;h.append(c)});rows.forEach(row=>{const tr=t.insertRow();row.forEach(x=>{const c=tr.insertCell();c.textContent=fmt(x)})});return t}
function runs(){return [...datasets.entries()].flatMap(([module,data])=>(data.runs||[]).map(run=>({module,run})))}
function selected(item){return filterIds.every(id=>{const wanted=document.getElementById(id).value;if(!wanted)return true;const value=id==="topology"?topology(item.run):String(item.run[id]??item.run.configuration?.[id]??"");return value===wanted})}
function options(){const labels={scenario_id:"全部场景 ID",payload_size_bytes:"全部消息大小",publish_rate_hz:"全部频率",topology:"全部拓扑",transport_mode:"全部传输",qos_profile:"全部 QoS",network_profile:"全部网络条件"};const all=runs();filterIds.forEach(id=>{const s=document.getElementById(id),old=s.value,vals=new Set(all.map(x=>id==="topology"?topology(x.run):x.run[id]??x.run.configuration?.[id]).filter(x=>x!==undefined&&x!==null));s.replaceChildren(new Option(labels[id],""));[...vals].sort().forEach(v=>s.add(new Option(v,v)));s.value=[...s.options].some(o=>o.value===old)?old:""})}
function render(){const chosen=runs().filter(selected),warning=document.getElementById("warning");warning.replaceChildren();const fingerprints=new Set(chosen.map(x=>x.run.comparison_fingerprint).filter(Boolean));if(fingerprints.size>1){const d=document.createElement("div");d.className="warning";d.textContent="当前结果含多个配置指纹，禁止直接混合平均或排名。请继续缩小筛选范围。";warning.append(d)}
const means=key=>{const v=chosen.map(x=>x.run[key]).filter(Number.isFinite);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};const cards=document.getElementById("cards");cards.replaceChildren();[["平均延迟 ms","latency_ms"],["P95 延迟 ms","latency_p95_ms"],["吞吐 Mbit/s","throughput_mbps"],["CPU %","cpu_percent"],["内存 MB","memory_mb"],["丢包率","packet_loss"],["抖动 ms","jitter_ms"],["发现时间 ms","discovery_time_ms"]].forEach(([name,key])=>{const d=document.createElement("div");d.className="card";d.innerHTML="<div class=muted></div><div class=value></div>";d.children[0].textContent=name;d.children[1].textContent=fmt(means(key));cards.append(d)});
document.getElementById("runs").replaceChildren(table(["模块","ID","场景","轮次","状态","大小 B","频率 Hz","拓扑","传输","网络","发送","接收","重复","乱序","损坏","丢包","P99 ms","吞吐"],chosen.map(({module,run:r})=>[module,r.scenario_id,r.scenario_name,r.repeat,r.status,r.payload_size_bytes,r.publish_rate_hz,topology(r),r.transport_mode,r.network_profile,r.messages_sent,r.messages_received,r.duplicate_count,r.out_of_order_count,r.corrupted_count,r.packet_loss,r.latency_p99_ms,r.throughput_mbps])));
const links=[];chosen.forEach(({module,run:r})=>{(r.publisher_metrics||[]).forEach(x=>links.push([module,r.run_id,"发布者 "+x.publisher,"",x.messages_sent,"",x.offered_payload_mbps,""]));(r.subscriber_metrics||[]).forEach(x=>links.push([module,r.run_id,"订阅者 "+x.subscriber,"",x.messages_sent,x.messages_received,x.throughput_mbps,x.packet_loss]));(r.link_metrics||[]).forEach(x=>links.push([module,r.run_id,"链路",x.publisher+"→"+x.subscriber,x.messages_sent,x.messages_received,x.throughput_mbps,x.packet_loss]))});document.getElementById("links").replaceChildren(table(["模块","Run ID","对象","端点","发送","接收","吞吐","丢包"],links));
document.getElementById("resources").replaceChildren(table(["模块","Run ID","中间件 CPU","中间件 MB","基础设施 CPU","基础设施 MB","注入","转发","丢弃","恢复 ms"],chosen.map(({module,run:r})=>{const m=r.middleware_resources||{},i=r.test_infrastructure_resources||{},n=r.network_impairment||{};return[module,r.run_id,m.cpu_percent,m.memory_mb,i.cpu_percent,i.memory_mb,n.injected_count,n.forwarded_count,n.dropped_count,n.recovery_time_ms]})));
const featureRows=[];profiles.forEach((p,module)=>(p.features||[]).forEach(f=>featureRows.push([module,f.feature_name,f.category,f.status,f.test_method,f.evidence,(f.limitations||[]).join("；")])));
document.getElementById("features").replaceChildren(table(["模块","功能","分类","状态","测试方法","证据","限制"],featureRows))}
document.getElementById("files").onchange=async e=>{const errors=[];for(const file of e.target.files){try{const d=JSON.parse(await file.text());if(Array.isArray(d.runs)&&d.schema_version==="2.1")datasets.set(d.module_name,d);else if(Array.isArray(d.features)&&d.schema_version==="1.0")profiles.set(d.module_name,d);else throw Error("不支持的 Schema")}catch(x){errors.push(file.name+"："+x.message)}}document.getElementById("errors").textContent=errors.join("\n");options();render();e.target.value=""};
filterIds.forEach(id=>document.getElementById(id).onchange=render);document.getElementById("clear").onclick=()=>{datasets.clear();profiles.clear();options();render()};render();
</script></body></html>
