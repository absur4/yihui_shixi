    scenario_id: S01
    scenario_name: point_to_point_latency
    scenario_title: S01 组1 点对点低延迟 1KiB @ 100Hz
    payload_size_bytes: 1024
    publish_rate_hz: 100
    message_count: 1000
    duration_seconds: 10
    publisher_count: 1
    subscriber_count: 1
    transport_mode: udp
    qos_profile: reliable
    warmup_seconds: 1.0
    drain_seconds: 2.0
    repeats: 1
    timeout_seconds: 120
