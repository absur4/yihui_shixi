# 四种中间件横向对比矩阵 · DDS 侧执行文件
# S01–S08 × 4 组 = 32 个条件，每个条件 1 轮。
#
# 参数唯一来源：songfei/test/run_matrix.py 的 PLAN（VSOA / MQTT / Zenoh 已按同一组参数跑完）。
# 目的：让 DDS 与其余三种在"完全相同的影响因子与档位"下可横向对比。
#
# 用法（详见仓库根目录 DDS_test.md）：
#   .venv\Scripts\python.exe launch.py check --config matrix_s01_s08.yaml
#   .venv\Scripts\python.exe launch.py run   --config matrix_s01_s08.yaml --output results\matrix_s01_s08 --overwrite
#
# 全部条件统一：transport_mode=udp（显式 UDPv4，不与 SHM 混测）、qos_profile=reliable、
# network_profile=normal（不注入网络损伤）、repeats=1、warmup_seconds=1.0、
# drain_seconds=2.0（收尾窗口，四家统一；阶梯实验：4P4S 在 1.0 s 缺 6.1%、2.0 s 起归零）、
# timeout_seconds=120（启动/发现等待上限）。

schema_version: "1.0"
metrics_definition_version: "1.0"

suite:
  middleware_id: dds
  module_name: dds
  domain_id_base: 80
  default_repeats: 1
  formal_repeats: 1

qos_profiles:
  reliable:                 # 与 DDS/config.yaml 的 reliable 档完全一致
    reliability: reliable
    durability: volatile
    history_kind: keep_last
    history_depth: 1024
    publish_mode: synchronous
    max_blocking_time_ms: 1000
    disable_data_sharing: true
    wait_for_acknowledgments: true

network_profiles:
  normal:
    latency_ms: 0
    jitter_ms: 0
    packet_loss_percent: 0
    bandwidth_mbps: 0
    impairment_required: false
    external_impairment_confirmed: true

conditions:
  # ---------------- S01 点对点低延迟 · 影响因子：发送速率 ----------------
