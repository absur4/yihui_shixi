[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zenoh-unified-adapter"
version = "1.1.0"
description = "Self-contained Zenoh adapter for the unified middleware benchmark"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "eclipse-zenoh>=1.10,<2",
  "psutil>=7,<8",
  "jsonschema>=4,<5",
]

[project.scripts]
zenoh-console = "Zenoh.console_runner:main"

[tool.setuptools]
packages = ["Zenoh", "Zenoh.zenoh_bench"]
include-package-data = false

[tool.setuptools.package-dir]
Zenoh = "."
"Zenoh.zenoh_bench" = "zenoh_bench"

[tool.setuptools.package-data]
Zenoh = ["*.json", "*.md"]
"Zenoh.zenoh_bench" = ["static/*.html"]
